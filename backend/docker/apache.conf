# Port remplacé au démarrage par $PORT (voir entrypoint.sh).
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Fichiers envoyés (photos, logos, brochures) : mis en cache par les navigateurs.
    <Directory /var/www/html/storage/app/public>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
