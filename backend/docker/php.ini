; Réglages PHP de production de l'API Edumada.
expose_php = Off
memory_limit = 256M
; Images jusqu'à 5 Mo, brochures PDF et pièces jointes de candidature.
upload_max_filesize = 12M
post_max_size = 32M
max_execution_time = 60

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
