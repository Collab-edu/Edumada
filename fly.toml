# fly.toml app configuration file generated for edumada-g8slkq on 2026-10-21T19:25:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'edumada-g8slkq'
primary_region = 'fra'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  DB_CONNECTION = 'pgsql'
  LOG_CHANNEL = 'stderr'
  MAIL_MAILER = 'log'
  PORT = '8080'
  QUEUE_CONNECTION = 'sync'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/up'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
